<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INSYSTEM | Atas e Contratos</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="menuContainer"></div>

    <main class="conteudo">
      <div class="topo-pagina">
        <h1>Painel de Atas e Contratos</h1>
        <div class="topo-direita">
          <div class="area-usuario">
            <span class="usuario-logado" id="usuarioLogado"></span>
            <button class="botao-sair" id="botaoSairTopo">Sair</button>
          </div>
          <img src="/static/logo_insystem.png" alt="INSYSTEM" class="logo-topo" />
        </div>
      </div>

      <section class="cartao filtros">
        <form id="formFiltros" class="grade-filtros">
          <div class="campo-filtro">
            <label for="filtroNumeroAtaContrato">Número da Ata/Contrato</label>
            <input type="text" id="filtroNumeroAtaContrato" placeholder="Ex.: 012/2026" />
          </div>

          <div class="campo-filtro campo-curto">
            <label for="filtroCnpj">CNPJ</label>
            <input type="text" id="filtroCnpj" placeholder="Ex.: 00.000.000/0000-00" />
          </div>

          <div class="campo-filtro campo-autocompletar campo-largo">
            <label for="filtroFornecedor">Fornecedor</label>
            <input type="text" id="filtroFornecedor" placeholder="Ex.: Art Medica" autocomplete="off" />
            <div class="sugestoes" id="sugestoesFornecedor"></div>
          </div>

          <div class="campo-filtro campo-curto">
            <label for="filtroCodSeplag">Cód. Seplag</label>
            <input type="text" id="filtroCodSeplag" placeholder="Ex.: 371891" />
          </div>

          <div class="campo-filtro campo-autocompletar campo-largo">
            <label for="filtroProduto">Produto</label>
            <input type="text" id="filtroProduto" placeholder="Ex.: Luva Cirúrgica" autocomplete="off" />
            <div class="sugestoes" id="sugestoesProduto"></div>
          </div>

          <div class="campo-filtro">
            <label for="filtroDataInicio">Data Início</label>
            <input type="date" id="filtroDataInicio" />
          </div>

          <div class="campo-filtro">
            <label for="filtroDataFim">Data Fim</label>
            <input type="date" id="filtroDataFim" />
          </div>

          <div class="campo-filtro campo-curto">
            <label for="filtroArmazem" title="Mostra só atas/contratos que já tiveram algum item recebido (entrada vinculada a um empenho) nesse armazém">Armazém</label>
            <select id="filtroArmazem">
              <option value="">Todos</option>
            </select>
          </div>

          <div class="campo-filtro campo-curto">
            <label for="filtroTipoPedido">Tipo de Ata/Contrato</label>
            <select id="filtroTipoPedido">
              <option value="">Todos</option>
              <option value="A">ARP</option>
              <option value="C">Aquisição</option>
              <option value="I">Imobilizados</option>
              <option value="S">Serviços</option>
            </select>
          </div>

          <div class="campo-filtro campo-acao">
            <div class="grupo-botoes-filtro">
              <button type="submit" class="botao-filtrar">Filtrar</button>
              <button type="button" class="botao-resetar" id="botaoResetarFiltros">Resetar</button>
            </div>
          </div>
        </form>
      </section>

      <div class="secao-navegacao">
        <a href="/pages/atas_contratos_vencidos.html" class="botao-navegacao">Ver Atas e Contratos Vencidos ▸</a>
      </div>

      <section class="cartao secao-pedidos">
        <div class="secao-cabecalho">
          <h2>Atas Válidas</h2>
          <span class="contador-secao" id="contadorAtasValidas">0</span>
        </div>
        <div id="areaAtasValidas">
          <p class="msg-vazio">Carregando dado, aguenta ai...</p>
        </div>
        <div class="paginacao" id="paginacaoAtasValidas"></div>
      </section>

      <section class="cartao secao-pedidos">
        <div class="secao-cabecalho">
          <h2>Contratos Válidos</h2>
          <span class="contador-secao" id="contadorContratosValidos">0</span>
        </div>
        <div id="areaContratosValidos">
          <p class="msg-vazio">Carregando dado, aguenta ai...</p>
        </div>
        <div class="paginacao" id="paginacaoContratosValidos"></div>
      </section>
    </main>
  </div>

  <script src="/static/js/sidebar.js"></script>
  <script src="/static/js/tabela.js"></script>
  <script>
    // caverna so abre pra quem tem crachá
    protegerPagina();
    iniciarMenu("atas_contratos");

    // cada secao guarda os ids (area/contador/paginacao) e os filtros tipo+situacao que manda pra api
    const SECOES = {
      atas_validas: { tipo: "ata", situacao: "validos", area: "areaAtasValidas", contador: "contadorAtasValidas", paginacao: "paginacaoAtasValidas" },
      contratos_validos: { tipo: "contrato", situacao: "validos", area: "areaContratosValidos", contador: "contadorContratosValidos", paginacao: "paginacaoContratosValidos" },
    };

    function montarQueryFiltros() {
      const params = new URLSearchParams();
      const numeroAtaContrato = document.getElementById("filtroNumeroAtaContrato").value.trim();
      const cnpj = document.getElementById("filtroCnpj").value.trim();
      const fornecedor = document.getElementById("filtroFornecedor").value.trim();
      const codSeplag = document.getElementById("filtroCodSeplag").value.trim();
      const produto = document.getElementById("filtroProduto").value.trim();
      const armazem = document.getElementById("filtroArmazem").value;
      const tipoPedido = document.getElementById("filtroTipoPedido").value;
      const dataInicio = document.getElementById("filtroDataInicio").value;
      const dataFim = document.getElementById("filtroDataFim").value;

      if (numeroAtaContrato) params.set("numero_ata_contrato", numeroAtaContrato);
      if (cnpj) params.set("cnpj", cnpj);
      if (fornecedor) params.set("fornecedor", fornecedor);
      if (codSeplag) params.set("cod_seplag", codSeplag);
      if (produto) params.set("produto", produto);
      if (armazem) params.set("armazem", armazem);
      if (tipoPedido) params.set("tipo_pedido", tipoPedido);
      if (dataInicio) params.set("data_inicio", dataInicio);
      if (dataFim) params.set("data_fim", dataFim);

      return params;
    }

    // lista completa de armazens (sem restricao pelo usuario logado - essa tela nunca teve esse
    // filtro implicito) so pra estreitar a busca manualmente
    preencherSelect("/api/armazens", "filtroArmazem");

    // seta vermelha em L (90 graus), mesma da tela de produtos, pra indicar hierarquia
    const SETA_HIERARQUIA = `
      <svg class="seta-hierarquia" width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 0 V12 A8 8 0 0 0 16 20 H22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
        <path d="M18 16 L23 20 L18 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>`;

    // ordenacao do cabecalho (setas ▲/▼ por campo) - estado global, vale pras duas secoes (Atas
    // Validas e Contratos Validos) ao mesmo tempo, igual os filtros. campo nulo = ordenacao
    // padrao do backend (por situacao - ver api_atas_contratos)
    let ordenarPor = null;
    let ordenarDirecao = "asc";

    function celulaOrdenavel(rotulo, campo) {
      const ativoAsc = ordenarPor === campo && ordenarDirecao === "asc";
      const ativoDesc = ordenarPor === campo && ordenarDirecao === "desc";
      return `
        <th>
          <span class="cabecalho-ordenavel">
            ${rotulo}
            <span class="botoes-ordenar">
              <button type="button" class="botao-ordenar${ativoAsc ? " ativo" : ""}" data-campo="${campo}" data-direcao="asc" title="Ordenar ${rotulo} crescente">▲</button>
              <button type="button" class="botao-ordenar${ativoDesc ? " ativo" : ""}" data-campo="${campo}" data-direcao="desc" title="Ordenar ${rotulo} decrescente">▼</button>
            </span>
          </span>
        </th>`;
    }

    // numero da versao atual (cada renovacao/aditivo ganha numero proprio no Guardiao) - quando
    // mudou desde o original, mostra o original embaixo pra ainda dar pra reconhecer o contrato
    function celulaNumero(atual, original) {
      const texto = escaparHtml(atual);
      if (!original || original === atual) return texto;
      return `${texto}<span class="numero-original">original: ${escaparHtml(original)}</span>`;
    }

    function renderizarContratos(dados, containerId) {
      const container = document.getElementById(containerId);

      if (!Array.isArray(dados) || dados.length === 0) {
        container.innerHTML = '<p class="msg-vazio">Nenhuma ata/contrato encontrada, homem.</p>';
        return;
      }

      const NUMERO_COLUNAS = 9;

      const linhas = dados
        .map(
          (linha) => `
        <tr class="linha-contrato" data-pedidocabecalho="${escaparHtml(linha.pedidocabecalho)}" data-identificacao="${escaparHtml(linha.numeroidentificacao)}">
          <td>${formatarCnpj(linha.cnpj)}</td>
          <td>${escaparHtml(linha.fornecedor)}</td>
          <td>${escaparHtml(linha.nome_fantasia)}</td>
          <td>${celulaNumero(linha.num_ata, linha.num_ata_original)}</td>
          <td>${celulaNumero(linha.num_contrato, linha.num_contrato_original)}</td>
          <td>${escaparHtml(linha.data_inicio)}</td>
          <td>${escaparHtml(linha.data_fim)}</td>
          <td>${escaparHtml(linha.prazo)}</td>
          <td>
            <div class="grupo-botoes-linha">
              <button type="button" class="botao-aditivos">Aditivos</button>
              <button type="button" class="botao-consumo">Consumo</button>
            </div>
          </td>
        </tr>
        <tr class="linha-saldo">
          <td colspan="${NUMERO_COLUNAS}">${montarBarraSaldo(linha)}</td>
        </tr>`
        )
        .join("");

      container.innerHTML = `
        <table class="tabela-dados">
          <thead>
            <tr>
              ${celulaOrdenavel("CNPJ", "cnpj")}
              ${celulaOrdenavel("Fornecedor", "fornecedor")}
              ${celulaOrdenavel("Nome Fantasia", "nome_fantasia")}
              ${celulaOrdenavel("Núm. Ata", "num_ata")}
              ${celulaOrdenavel("Núm. Contrato", "num_contrato")}
              ${celulaOrdenavel("Data Início", "data_inicio")}
              ${celulaOrdenavel("Data Fim", "data_fim")}
              ${celulaOrdenavel("Prazo (dias)", "prazo")}
              <th></th>
            </tr>
          </thead>
          <tbody>${linhas}</tbody>
        </table>`;

      container.querySelectorAll(".botao-ordenar").forEach((botao) => {
        botao.addEventListener("click", () => {
          ordenarPor = botao.dataset.campo;
          ordenarDirecao = botao.dataset.direcao;
          buscarAtasContratos();
        });
      });

      container.querySelectorAll(".botao-aditivos").forEach((botao) => {
        botao.addEventListener("click", (ev) => {
          const linhaContrato = ev.currentTarget.closest("tr");
          alternarDetalhe(linhaContrato, "aditivos");
        });
      });

      container.querySelectorAll(".botao-consumo").forEach((botao) => {
        botao.addEventListener("click", (ev) => {
          const linhaContrato = ev.currentTarget.closest("tr");
          alternarDetalhe(linhaContrato, "consumo");
        });
      });

      container.querySelectorAll(".botao-itens").forEach((botao) => {
        botao.addEventListener("click", (ev) => {
          const linhaContrato = ev.currentTarget.closest("tr").previousElementSibling;
          alternarDetalhe(linhaContrato, "itens");
        });
      });
    }

    // verde > 50%, laranja > 30%, amarela > 10%, vermelha <= 10% de saldo remanescente
    function corBarraSaldo(percentualRemanescente) {
      const valor = Number(percentualRemanescente) || 0;
      if (valor > 50) return "verde";
      if (valor > 30) return "laranja";
      if (valor > 10) return "amarela";
      return "vermelha";
    }

    // percentual negativo (saldo estourado, gastou mais do que o contratado) enche a barra 100%
    // em vermelho da esquerda pra direita - o texto mostra o percentual real, negativo e tudo
    function montarBarraPercentual(percentualBruto) {
      const valor = Number(percentualBruto) || 0;
      const negativo = valor < 0;
      const largura = negativo ? 100 : Math.min(valor, 100);
      const cor = negativo ? "vermelha" : corBarraSaldo(largura);

      return `
        <div class="barra-percentual">
          <div class="barra-percentual-preenchida ${cor}" style="width: ${largura}%"></div>
          <span class="barra-percentual-texto">${valor.toFixed(2)}% remanescente</span>
        </div>`;
    }

    function montarBarraSaldo(linha) {
      return `
        <div class="barra-saldo-linha">
          <span class="saldo-info"><strong>Saldo Total:</strong> ${formatarMoeda(linha.saldo_total)}</span>
          <span class="saldo-info"><strong>Saldo Utilizado:</strong> ${formatarMoeda(linha.saldo_utilizado)}</span>
          <span class="saldo-info"><strong>Saldo Remanescente:</strong> ${formatarMoeda(linha.saldo_remanescente)}</span>
          ${montarBarraPercentual(linha.percentual_remanescente)}
          <button type="button" class="botao-itens">Itens</button>
        </div>`;
    }

    // clique em "Aditivos" ou "Itens" abre uma linha logo abaixo da linha-saldo - so uma aberta por vez
    // (linhaContrato eh sempre a 1a das duas linhas do registro; a linha-saldo vem logo depois dela)
    async function alternarDetalhe(linhaContrato, tipo) {
      const linhaSaldo = linhaContrato.nextElementSibling;
      const linhaDetalhe = linhaSaldo.nextElementSibling;
      const classeDetalhe = `linha-detalhe-${tipo}`;

      if (linhaDetalhe && linhaDetalhe.classList.contains(classeDetalhe)) {
        linhaDetalhe.remove();
        linhaContrato.classList.remove("linha-contrato-ativa");
        return;
      }

      fecharDetalhesAbertos();
      linhaContrato.classList.add("linha-contrato-ativa");

      const trDetalhe = document.createElement("tr");
      trDetalhe.className = classeDetalhe;
      trDetalhe.innerHTML = `<td colspan="9"><p class="msg-vazio">Carregando...</p></td>`;
      linhaSaldo.after(trDetalhe);

      try {
        if (tipo === "aditivos") {
          const resp = await fetch(`/api/atas_contratos_aditivos?identificacao=${encodeURIComponent(linhaContrato.dataset.identificacao)}`);
          const aditivos = await resp.json();
          trDetalhe.innerHTML = `<td colspan="9">${montarTabelaAditivos(aditivos)}</td>`;
        } else if (tipo === "consumo") {
          const resp = await fetch(`/api/atas_contratos_pedidos?identificacao=${encodeURIComponent(linhaContrato.dataset.identificacao)}`);
          const pedidos = await resp.json();
          trDetalhe.innerHTML = `<td colspan="9">${montarTabelaPedidos(pedidos, linhaContrato.dataset.identificacao)}</td>`;
          ligarBotoesItensPedido(trDetalhe);
        } else {
          const resp = await fetch(`/api/atas_contratos_itens?pedidocabecalho=${encodeURIComponent(linhaContrato.dataset.pedidocabecalho)}`);
          const itens = await resp.json();
          trDetalhe.innerHTML = `<td colspan="9">${montarTabelaItens(itens)}</td>`;
        }
      } catch (erro) {
        trDetalhe.innerHTML = `<td colspan="9"><p class="msg-vazio">Erro ao carregar: ${escaparHtml(erro)}</p></td>`;
      }
    }

    function fecharDetalhesAbertos() {
      document.querySelectorAll('[class^="linha-detalhe-"]').forEach((el) => el.remove());
      document.querySelectorAll(".linha-contrato-ativa").forEach((el) => el.classList.remove("linha-contrato-ativa"));
    }

    function montarTabelaAditivos(aditivos) {
      if (!Array.isArray(aditivos) || aditivos.length === 0) {
        return '<p class="msg-vazio">Nenhum registro encontrado.</p>';
      }

      const linhas = aditivos
        .map(
          (item) => `
        <tr>
          <td>${item.numero_aditivo == 0 ? "Original" : item.numero_aditivo}</td>
          <td>${escaparHtml(item.num_ata)}</td>
          <td>${escaparHtml(item.num_contrato)}</td>
          <td>${escaparHtml(item.data_inicio)}</td>
          <td>${escaparHtml(item.data_fim)}</td>
        </tr>`
        )
        .join("");

      return `
        <div class="bloco-hierarquia">
          ${SETA_HIERARQUIA}
          <table class="tabela-lotes">
            <thead>
              <tr>
                <th>Aditivo</th>
                <th>Núm. Ata</th>
                <th>Núm. Contrato</th>
                <th>Data Início</th>
                <th>Data Fim</th>
              </tr>
            </thead>
            <tbody>${linhas}</tbody>
          </table>
        </div>`;
    }

    // "pedidos" (botao Consumo): empenhos agrupados por data de destaque dentro da familia
    // inteira (numeroidentificacao) - cada linha e um dia em que um ou mais produtos foram
    // destacados contra essa ata/contrato. clicar em "Itens" numa linha mostra os produtos
    // daquele pedido especifico (nested, independente do alternarDetalhe de fora)
    function montarTabelaPedidos(pedidos, identificacao) {
      if (!Array.isArray(pedidos) || pedidos.length === 0) {
        return '<p class="msg-vazio">Nenhum pedido encontrado pra essa ata/contrato.</p>';
      }

      const linhas = pedidos
        .map(
          (item) => `
        <tr class="linha-pedido" data-identificacao="${escaparHtml(identificacao)}" data-data-pedido="${escaparHtml(item.data_pedido_iso)}">
          <td>${escaparHtml(item.data_pedido)}</td>
          <td>${escaparHtml(item.quantidade_itens)}</td>
          <td>${formatarMoeda(item.valor_total)}</td>
          <td><button type="button" class="botao-itens-pedido">Itens</button></td>
        </tr>`
        )
        .join("");

      return `
        <div class="bloco-hierarquia">
          ${SETA_HIERARQUIA}
          <table class="tabela-lotes">
            <thead>
              <tr>
                <th>Data do Pedido</th>
                <th>Qtde. de Itens</th>
                <th>Valor Total</th>
                <th></th>
              </tr>
            </thead>
            <tbody>${linhas}</tbody>
          </table>
        </div>`;
    }

    function montarTabelaItensPedido(itens) {
      if (!Array.isArray(itens) || itens.length === 0) {
        return '<p class="msg-vazio">Nenhum item encontrado pra esse pedido.</p>';
      }

      const linhas = itens
        .map(
          (item) => `
        <tr>
          <td>${escaparHtml(item.cod_seplag)}</td>
          <td class="celula-quebra">${escaparHtml(item.nome_produto)}</td>
          <td>${formatarQuantidade(item.quantidade)}</td>
          <td>${formatarMoeda(item.valor_unitario)}</td>
          <td>${formatarMoeda(item.subtotal)}</td>
        </tr>`
        )
        .join("");

      return `
        <div class="bloco-hierarquia">
          ${SETA_HIERARQUIA}
          <table class="tabela-lotes">
            <thead>
              <tr>
                <th>Cód. Seplag</th>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Vl. Unitário</th>
                <th>Subtotal</th>
              </tr>
            </thead>
            <tbody>${linhas}</tbody>
          </table>
        </div>`;
    }

    // clique em "Itens" numa linha-pedido abre uma linha logo abaixo so dela - independente do
    // alternarDetalhe de fora (colspan de 4, da tabela de pedidos, nao de 9)
    async function alternarItensPedido(linhaPedido) {
      const linhaDetalhe = linhaPedido.nextElementSibling;

      if (linhaDetalhe && linhaDetalhe.classList.contains("linha-detalhe-itens-pedido")) {
        linhaDetalhe.remove();
        return;
      }

      linhaPedido.parentElement.querySelectorAll(".linha-detalhe-itens-pedido").forEach((el) => el.remove());

      const trDetalhe = document.createElement("tr");
      trDetalhe.className = "linha-detalhe-itens-pedido";
      trDetalhe.innerHTML = `<td colspan="4"><p class="msg-vazio">Carregando...</p></td>`;
      linhaPedido.after(trDetalhe);

      try {
        const params = new URLSearchParams({
          identificacao: linhaPedido.dataset.identificacao,
          data_pedido: linhaPedido.dataset.dataPedido,
        });
        const resp = await fetch(`/api/atas_contratos_pedido_itens?${params.toString()}`);
        const itens = await resp.json();
        trDetalhe.innerHTML = `<td colspan="4">${montarTabelaItensPedido(itens)}</td>`;
      } catch (erro) {
        trDetalhe.innerHTML = `<td colspan="4"><p class="msg-vazio">Erro ao carregar: ${escaparHtml(erro)}</p></td>`;
      }
    }

    function ligarBotoesItensPedido(container) {
      container.querySelectorAll(".botao-itens-pedido").forEach((botao) => {
        botao.addEventListener("click", (ev) => {
          alternarItensPedido(ev.currentTarget.closest("tr"));
        });
      });
    }

    function montarBarraSaldoItem(item) {
      return `
        <div class="barra-saldo-linha">
          <span class="saldo-info"><strong>Qtd. Utilizada:</strong> ${escaparHtml(item.quantidade_utilizada ?? "0")}</span>
          ${montarBarraPercentual(item.percentual_remanescente)}
        </div>`;
    }

    function montarTabelaItens(itens) {
      if (!Array.isArray(itens) || itens.length === 0) {
        return '<p class="msg-vazio">Nenhum item encontrado.</p>';
      }

      const linhas = itens
        .map(
          (item) => `
        <tr class="linha-item">
          <td>${escaparHtml(item.cod_seplag)}</td>
          <td class="celula-quebra">${escaparHtml(item.nome_produto)}</td>
          <td class="celula-quebra">${escaparHtml(item.descricao_produto)}</td>
          <td>${escaparHtml(item.quantidade)}</td>
          <td>${formatarMoeda(item.valor_unitario)}</td>
          <td>${formatarMoeda(item.subtotal)}</td>
          <td>${formatarMoeda(item.saldo_valor)}</td>
          <td></td>
        </tr>
        <tr class="linha-saldo">
          <td colspan="8">${montarBarraSaldoItem(item)}</td>
        </tr>`
        )
        .join("");

      return `
        <div class="bloco-hierarquia">
          ${SETA_HIERARQUIA}
          <table class="tabela-lotes">
            <thead>
              <tr>
                <th>Cód. Seplag</th>
                <th>Produto</th>
                <th>Descrição</th>
                <th>Quantidade Total</th>
                <th>Vl. Unitário</th>
                <th>Subtotal</th>
                <th>Saldo Remanescente</th>
                <th></th>
              </tr>
            </thead>
            <tbody>${linhas}</tbody>
          </table>
        </div>`;
    }

    // paginador compacto: anterior, um punhado de numeros perto da atual, proxima
    function renderizarPaginacao(total, pagina, tamanhoPagina, chaveSecao, paginacaoId) {
      const area = document.getElementById(paginacaoId);
      const totalPaginas = Math.max(Math.ceil(total / tamanhoPagina), 1);

      if (totalPaginas <= 1) {
        area.innerHTML = "";
        return;
      }

      const inicio = Math.max(pagina - 2, 1);
      const fim = Math.min(inicio + 4, totalPaginas);

      let botoes = `<button type="button" class="botao-pagina" data-pagina="${pagina - 1}" ${pagina <= 1 ? "disabled" : ""}>‹ Anterior</button>`;

      for (let n = inicio; n <= fim; n++) {
        botoes += `<button type="button" class="botao-pagina ${n === pagina ? "ativo" : ""}" data-pagina="${n}">${n}</button>`;
      }

      botoes += `<button type="button" class="botao-pagina" data-pagina="${pagina + 1}" ${pagina >= totalPaginas ? "disabled" : ""}>Próxima ›</button>`;

      area.innerHTML = botoes;

      area.querySelectorAll(".botao-pagina").forEach((botao) => {
        botao.addEventListener("click", () => buscarSecao(chaveSecao, Number(botao.dataset.pagina)));
      });
    }

    async function buscarSecao(chaveSecao, pagina) {
      const secao = SECOES[chaveSecao];
      const params = montarQueryFiltros();
      params.set("tipo", secao.tipo);
      params.set("situacao", secao.situacao);
      params.set("pagina", pagina);
      if (ordenarPor) {
        params.set("ordenar_por", ordenarPor);
        params.set("ordenar_direcao", ordenarDirecao);
      }

      const container = document.getElementById(secao.area);
      container.innerHTML = '<p class="msg-vazio">Carregando dado, aguenta ai...</p>';

      try {
        const resp = await fetch(`/api/atas_contratos?${params.toString()}`);
        const resultado = await resp.json();

        document.getElementById(secao.contador).textContent = resultado.total ?? 0;
        renderizarContratos(resultado.dados, secao.area);
        renderizarPaginacao(resultado.total ?? 0, resultado.pagina ?? pagina, resultado.tamanho_pagina ?? 20, chaveSecao, secao.paginacao);
      } catch (erro) {
        container.innerHTML = `<p class="msg-vazio">Erro ao caçar dados: ${escaparHtml(erro)}</p>`;
        document.getElementById(secao.paginacao).innerHTML = "";
      }
    }

    function buscarAtasContratos() {
      Object.keys(SECOES).forEach((chave) => buscarSecao(chave, 1));
    }

    document.getElementById("formFiltros").addEventListener("submit", (ev) => {
      ev.preventDefault();
      buscarAtasContratos();
    });

    document.getElementById("botaoResetarFiltros").addEventListener("click", () => {
      document.getElementById("formFiltros").reset();
      buscarAtasContratos();
    });

    // sugestao de fornecedor enquanto digita, com debounce pra nao martelar a api a cada tecla
    const campoFornecedor = document.getElementById("filtroFornecedor");
    const caixaSugestoesFornecedor = document.getElementById("sugestoesFornecedor");
    let temporizadorSugestaoFornecedor = null;

    function esconderSugestoesFornecedor() {
      caixaSugestoesFornecedor.innerHTML = "";
      caixaSugestoesFornecedor.classList.remove("aberto");
    }

    async function buscarSugestoesFornecedor(termo) {
      try {
        const resp = await fetch(`/api/fornecedores_sugestoes?termo=${encodeURIComponent(termo)}`);
        const dados = await resp.json();

        if (!Array.isArray(dados) || dados.length === 0) {
          esconderSugestoesFornecedor();
          return;
        }

        caixaSugestoesFornecedor.innerHTML = dados
          .map((item) => `<div class="item-sugestao" data-nome="${escaparHtml(item.fornecedor)}">${escaparHtml(item.fornecedor)}</div>`)
          .join("");
        caixaSugestoesFornecedor.classList.add("aberto");

        caixaSugestoesFornecedor.querySelectorAll(".item-sugestao").forEach((item) => {
          item.addEventListener("click", () => {
            campoFornecedor.value = item.dataset.nome;
            esconderSugestoesFornecedor();
            buscarAtasContratos();
          });
        });
      } catch (erro) {
        esconderSugestoesFornecedor();
      }
    }

    campoFornecedor.addEventListener("input", () => {
      const termo = campoFornecedor.value.trim();
      clearTimeout(temporizadorSugestaoFornecedor);

      if (!termo) {
        esconderSugestoesFornecedor();
        return;
      }

      temporizadorSugestaoFornecedor = setTimeout(() => buscarSugestoesFornecedor(termo), 250);
    });

    // sugestao de produto enquanto digita, com debounce pra nao martelar a api a cada tecla
    const campoProduto = document.getElementById("filtroProduto");
    const caixaSugestoesProduto = document.getElementById("sugestoesProduto");
    let temporizadorSugestaoProduto = null;

    function esconderSugestoesProduto() {
      caixaSugestoesProduto.innerHTML = "";
      caixaSugestoesProduto.classList.remove("aberto");
    }

    async function buscarSugestoesProduto(termo) {
      try {
        const resp = await fetch(`/api/produtos_sugestoes?termo=${encodeURIComponent(termo)}`);
        const dados = await resp.json();

        if (!Array.isArray(dados) || dados.length === 0) {
          esconderSugestoesProduto();
          return;
        }

        caixaSugestoesProduto.innerHTML = dados
          .map((item) => `<div class="item-sugestao" data-nome="${escaparHtml(item.nome_produto)}">${escaparHtml(item.nome_produto)}</div>`)
          .join("");
        caixaSugestoesProduto.classList.add("aberto");

        caixaSugestoesProduto.querySelectorAll(".item-sugestao").forEach((item) => {
          item.addEventListener("click", () => {
            campoProduto.value = item.dataset.nome;
            esconderSugestoesProduto();
            buscarAtasContratos();
          });
        });
      } catch (erro) {
        esconderSugestoesProduto();
      }
    }

    campoProduto.addEventListener("input", () => {
      const termo = campoProduto.value.trim();
      clearTimeout(temporizadorSugestaoProduto);

      if (!termo) {
        esconderSugestoesProduto();
        return;
      }

      temporizadorSugestaoProduto = setTimeout(() => buscarSugestoesProduto(termo), 250);
    });

    document.addEventListener("click", (ev) => {
      if (!ev.target.closest(".campo-autocompletar")) {
        esconderSugestoesFornecedor();
        esconderSugestoesProduto();
      }
    });

    buscarAtasContratos();
  </script>
</body>
</html>
