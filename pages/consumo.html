<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INSYSTEM | Consumo</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="menuContainer"></div>

    <main class="conteudo">
      <div class="topo-pagina">
        <h1>Consumo</h1>
        <div class="topo-direita">
          <button type="button" class="botao-resetar" id="botaoVoltar">Voltar</button>
          <div class="area-usuario">
            <span class="usuario-logado" id="usuarioLogado"></span>
            <button class="botao-sair" id="botaoSairTopo">Sair</button>
          </div>
          <img src="/static/logo_insystem.png" alt="INSYSTEM" class="logo-topo" />
        </div>
      </div>

      <section class="cartao filtros">
        <form id="formFiltros" class="grade-filtros">
          <div class="campo-filtro campo-curto">
            <label for="filtroCodSeplag">Cód. Seplag</label>
            <input type="text" id="filtroCodSeplag" placeholder="Ex.: 371891" />
          </div>

          <div class="campo-filtro campo-curto">
            <label for="filtroCodAlmox">Cód. Almox</label>
            <input type="text" id="filtroCodAlmox" placeholder="Ex.: 6355" />
          </div>

          <div class="campo-filtro campo-curto">
            <label for="filtroCodProduto">Cód. Produto</label>
            <input type="text" id="filtroCodProduto" placeholder="Ex.: 105844" />
          </div>

          <div class="campo-filtro campo-autocompletar campo-largo">
            <label for="filtroNomeProduto">Nome do Produto</label>
            <input type="text" id="filtroNomeProduto" placeholder="Ex.: Agulha descartável" autocomplete="off" />
            <div class="sugestoes" id="sugestoesNomeProduto"></div>
          </div>

          <div class="campo-filtro campo-autocompletar campo-largo">
            <label for="filtroDescricao">Descrição</label>
            <input type="text" id="filtroDescricao" placeholder="Ex.: ATOXICO, APIROGENICO" autocomplete="off" />
            <div class="sugestoes" id="sugestoesDescricao"></div>
          </div>

          <div class="campo-filtro campo-curto">
            <label for="filtroDataInicio">Data Início</label>
            <input type="date" id="filtroDataInicio" />
          </div>

          <div class="campo-filtro campo-curto">
            <label for="filtroDataFim">Data Fim</label>
            <input type="date" id="filtroDataFim" />
          </div>

          <div class="campo-filtro campo-curto oculto" id="blocoFiltroArmazem">
            <label for="filtroArmazem">Armazém</label>
            <select id="filtroArmazem">
              <option value="">Todos</option>
            </select>
          </div>

          <div class="campo-filtro campo-acao">
            <div class="grupo-botoes-filtro">
              <button type="submit" class="botao-filtrar">Filtrar</button>
              <button type="button" class="botao-resetar" id="botaoResetarFiltros">Resetar</button>
            </div>
          </div>
        </form>
      </section>

      <section class="cartao secao-pedidos">
        <div class="secao-cabecalho secao-cabecalho-relatorio" id="cabecalhoResumo">
          <h2>Resumo</h2>
          <span class="contador-secundario" id="resumoItensUnicos">Itens Únicos: 0</span>
          <span class="contador-secundario" id="resumoQuantidadeTotal">Qtde. Total: 0</span>
          <span class="contador-secundario" id="resumoValorTotal">Valor Total: R$ 0,00</span>
          <button type="button" class="botao-filtrar secao-cabecalho-botao-fim" id="botaoGerarRelatorioResumo">Gerar Relatório</button>
          <button type="button" class="botao-resetar" id="botaoCsvResumo">CSV</button>
          <button type="button" class="botao-resetar" id="botaoXlsxResumo">Planilha</button>
        </div>
        <div class="secao-cabecalho secao-cabecalho-relatorio" id="cabecalhoResumoCd">
          <span class="rotulo-origem-resumo">CD</span>
          <span class="contador-secundario" id="resumoCdItensUnicos">Itens Únicos: 0</span>
          <span class="contador-secundario" id="resumoCdQuantidadeTotal">Qtde. Total: 0</span>
          <span class="contador-secundario" id="resumoCdValorTotal">Valor Total: R$ 0,00</span>
        </div>
        <div class="secao-cabecalho secao-cabecalho-relatorio" id="cabecalhoResumoHospital">
          <span class="rotulo-origem-resumo">Hospital</span>
          <span class="contador-secundario" id="resumoHospitalItensUnicos">Itens Únicos: 0</span>
          <span class="contador-secundario" id="resumoHospitalQuantidadeTotal">Qtde. Total: 0</span>
          <span class="contador-secundario" id="resumoHospitalValorTotal">Valor Total: R$ 0,00</span>
        </div>
      </section>

      <section class="cartao secao-pedidos" id="secaoItensCd">
        <div class="secao-cabecalho">
          <h2>Itens do CD</h2>
          <span class="contador-secao" id="contadorMovimentacoesCd">0</span>
          <button type="button" class="botao-filtrar secao-cabecalho-botao-fim" id="botaoGerarRelatorioCd">Gerar Relatório</button>
          <button type="button" class="botao-resetar" id="botaoCsvCd">CSV</button>
          <button type="button" class="botao-resetar" id="botaoXlsxCd">Planilha</button>
        </div>
        <div id="areaMovimentacoesCd">
          <p class="msg-vazio">Carregando dado, aguenta ai...</p>
        </div>
        <div class="paginacao" id="areaPaginacaoCd"></div>
      </section>

      <section class="cartao secao-pedidos">
        <div class="secao-cabecalho">
          <h2>Itens do Hospital</h2>
          <span class="contador-secao" id="contadorMovimentacoesHospital">0</span>
          <button type="button" class="botao-filtrar secao-cabecalho-botao-fim" id="botaoGerarRelatorioHospital">Gerar Relatório</button>
          <button type="button" class="botao-resetar" id="botaoCsvHospital">CSV</button>
          <button type="button" class="botao-resetar" id="botaoXlsxHospital">Planilha</button>
        </div>
        <div id="areaMovimentacoesHospital">
          <p class="msg-vazio">Carregando dado, aguenta ai...</p>
        </div>
        <div class="paginacao" id="areaPaginacaoHospital"></div>
      </section>
    </main>
  </div>

  <script src="/static/js/sidebar.js"></script>
  <script src="/static/js/tabela.js"></script>
  <script>
    // caverna so abre pra quem tem crachá - usa a chave "estoque" (nao tem item proprio no menu,
    // essa pagina so se chega pelo botao "Consumo" em estoque.html) pra herdar a mesma permissao
    // de quem pode ver Controle de Estoque, e deixar o item correspondente marcado como ativo
    protegerPagina();
    iniciarMenu("estoque");
    document.getElementById("botaoVoltar").addEventListener("click", () => {
      window.location.href = "/pages/estoque.html";
    });

    // padrao mostra tudo a partir de 01-10-2026 (janela util de dado real de teste) ate hoje -
    // sem limite superior, data suja antiga (ano digitado errado tipo 6019) sobe pro topo da lista
    document.getElementById("filtroDataInicio").value = "2026-10-01";
    document.getElementById("filtroDataFim").value = dataHojeISO();

    // essa pagina eh aberta vinda do botao "Consumo" em estoque.html, que ja manda o filtro
    // atual na querystring - repopula o formulario com o que veio de la
    const parametrosIniciais = new URLSearchParams(window.location.search);
    const MAPA_CAMPOS_INICIAIS = {
      cod_seplag: "filtroCodSeplag",
      cod_almox: "filtroCodAlmox",
      cod_produto: "filtroCodProduto",
      nome_produto: "filtroNomeProduto",
      descricao: "filtroDescricao",
      data_inicio: "filtroDataInicio",
      data_fim: "filtroDataFim",
    };
    Object.entries(MAPA_CAMPOS_INICIAIS).forEach(([parametro, campoId]) => {
      const valor = parametrosIniciais.get(parametro);
      if (valor) document.getElementById(campoId).value = valor;
    });

    function montarQueryFiltros() {
      const params = new URLSearchParams();
      const codSeplag = document.getElementById("filtroCodSeplag").value.trim();
      const codAlmox = document.getElementById("filtroCodAlmox").value.trim();
      const codProduto = document.getElementById("filtroCodProduto").value.trim();
      const nomeProduto = document.getElementById("filtroNomeProduto").value.trim();
      const descricao = document.getElementById("filtroDescricao").value.trim();
      const dataInicio = document.getElementById("filtroDataInicio").value;
      const dataFim = document.getElementById("filtroDataFim").value;
      const armazem = document.getElementById("filtroArmazem").value;

      if (codSeplag) params.set("cod_seplag", codSeplag);
      if (codAlmox) params.set("cod_almox", codAlmox);
      if (codProduto) params.set("cod_produto", codProduto);
      if (nomeProduto) params.set("nome_produto", nomeProduto);
      if (descricao) params.set("descricao", descricao);
      if (dataInicio) params.set("data_inicio", dataInicio);
      if (dataFim) params.set("data_fim", dataFim);
      if (armazem) params.set("armazem", armazem);
      if (identificacaoLogada()) params.set("usuario_logado", identificacaoLogada());

      return params;
    }

    // sufixo: "" (linha 1, total combinado), "Cd" (linha 2) ou "Hospital" (linha 3) - cada linha
    // tem o mesmo conjunto de badges, so trocando o prefixo do id
    function renderizarResumo(resumo, sufixo) {
      document.getElementById(`resumo${sufixo}ItensUnicos`).textContent = `Itens Únicos: ${resumo.itens_unicos ?? 0}`;
      document.getElementById(`resumo${sufixo}QuantidadeTotal`).textContent = `Qtde. Total: ${formatarQuantidade(resumo.quantidade_total)}`;
      document.getElementById(`resumo${sufixo}ValorTotal`).textContent = `Valor Total: ${formatarMoeda(resumo.valor_total)}`;
    }

    async function buscarResumoOrigem(origem, sufixo) {
      const params = montarQueryFiltros();
      if (origem) params.set("origem", origem);

      try {
        const resp = await fetch(`/api/consumo_resumo?${params.toString()}`);
        const resumo = await resp.json();
        renderizarResumo(resumo, sufixo);
      } catch (erro) {
        console.error(`Erro ao carregar resumo (${sufixo || "total"}):`, erro);
      }
    }

    async function buscarResumo() {
      await Promise.all([
        buscarResumoOrigem(null, ""),
        buscarResumoOrigem("cd", "Cd"),
        buscarResumoOrigem("hospital", "Hospital"),
      ]);
    }

    function renderizarMovimentacoes(dados, containerId) {
      const container = document.getElementById(containerId);

      if (!Array.isArray(dados) || dados.length === 0) {
        container.innerHTML = '<p class="msg-vazio">Nenhuma movimentação encontrada, homem.</p>';
        return;
      }

      const linhas = dados
        .map(
          (item) => `
        <tr>
          <td>${escaparHtml(item.cod_seplag)}</td>
          <td>${escaparHtml(item.cod_almox)}</td>
          <td>${escaparHtml(item.cod_produto)}</td>
          <td class="celula-quebra">${escaparHtml(item.nome_produto)}</td>
          <td class="celula-quebra">${escaparHtml(item.descricao_produto)}</td>
          <td>${escaparHtml(item.lote)}</td>
          <td>${escaparHtml(item.tipo_movimentacao)}</td>
          <td>${formatarQuantidade(item.quantidade)}</td>
          <td>${formatarMoeda(item.valor_unitario)}</td>
          <td>${formatarMoeda(item.valor_total)}</td>
          <td>${escaparHtml(item.data_movimentacao)}</td>
        </tr>`
        )
        .join("");

      container.innerHTML = `
        <table class="tabela-dados">
          <thead>
            <tr>
              <th>Cód. Seplag</th>
              <th>Cód. Almox</th>
              <th>Cód. Produto</th>
              <th>Produto</th>
              <th>Descrição</th>
              <th>Lote</th>
              <th>Tipo de Movimentação</th>
              <th>Qtde.</th>
              <th>Valor Unitário</th>
              <th>Valor Total</th>
              <th>Dt. da Movimentação</th>
            </tr>
          </thead>
          <tbody>${linhas}</tbody>
        </table>`;
    }

    function renderizarPaginacao(total, pagina, tamanhoPagina, areaId, aoTrocarPagina) {
      const area = document.getElementById(areaId);
      const totalPaginas = Math.max(Math.ceil(total / tamanhoPagina), 1);

      if (totalPaginas <= 1) {
        area.innerHTML = "";
        return;
      }

      const inicio = Math.max(pagina - 2, 1);
      const fim = Math.min(inicio + 4, totalPaginas);

      let botoes = `<button type="button" class="botao-pagina" data-pagina="${pagina - 1}" ${pagina <= 1 ? "disabled" : ""}>‹ Anterior</button>`;

      for (let n = inicio; n <= fim; n++) {
        botoes += `<button type="button" class="botao-pagina ${n === pagina ? "ativo" : ""}" data-pagina="${n}">${n}</button>`;
      }

      botoes += `<button type="button" class="botao-pagina" data-pagina="${pagina + 1}" ${pagina >= totalPaginas ? "disabled" : ""}>Próxima ›</button>`;

      area.innerHTML = botoes;

      area.querySelectorAll(".botao-pagina").forEach((botao) => {
        botao.addEventListener("click", () => aoTrocarPagina(Number(botao.dataset.pagina)));
      });
    }

    // origem: "cd" ou "hospital" - cada lista (itens do CD / itens do hospital, separadas pelo
    // fornecedor do lote) eh buscada e paginada de forma independente
    async function buscarMovimentacoes(origem, pagina) {
      const params = montarQueryFiltros();
      params.set("origem", origem);
      params.set("pagina", pagina);

      const sufixo = origem === "cd" ? "Cd" : "Hospital";
      const container = document.getElementById(`areaMovimentacoes${sufixo}`);
      container.innerHTML = '<p class="msg-vazio">Carregando dado, aguenta ai...</p>';

      try {
        const resp = await fetch(`/api/consumo?${params.toString()}`);
        const resultado = await resp.json();
        const total = resultado.total ?? 0;

        // sem item nenhum do CD pros filtros atuais, a sessao "Itens do CD" nem aparece
        if (origem === "cd") {
          document.getElementById("secaoItensCd").classList.toggle("oculto", total === 0);
        }

        document.getElementById(`contadorMovimentacoes${sufixo}`).textContent = total;
        renderizarMovimentacoes(resultado.dados, `areaMovimentacoes${sufixo}`);
        renderizarPaginacao(
          total,
          resultado.pagina ?? pagina,
          resultado.tamanho_pagina ?? 20,
          `areaPaginacao${sufixo}`,
          (novaPagina) => buscarMovimentacoes(origem, novaPagina)
        );
      } catch (erro) {
        container.innerHTML = `<p class="msg-vazio">Erro ao caçar dados: ${escaparHtml(erro)}</p>`;
        document.getElementById(`areaPaginacao${sufixo}`).innerHTML = "";
      }
    }

    // resumo e as duas listas paginadas sao independentes, mas sempre atualizam juntos quando o
    // filtro muda
    function buscarTudo() {
      buscarResumo();
      buscarMovimentacoes("cd", 1);
      buscarMovimentacoes("hospital", 1);
    }

    document.getElementById("formFiltros").addEventListener("submit", (ev) => {
      ev.preventDefault();
      esconderSugestoes();
      esconderSugestoesDescricao();
      buscarTudo();
    });

    document.getElementById("botaoResetarFiltros").addEventListener("click", () => {
      document.getElementById("formFiltros").reset();
      document.getElementById("filtroDataInicio").value = "2026-10-01";
      document.getElementById("filtroDataFim").value = dataHojeISO();
      esconderSugestoes();
      esconderSugestoesDescricao();
      buscarTudo();
    });

    // select de armazem so ganha as opcoes depois do fetch (async) - o valor que veio da
    // querystring so pode ser aplicado depois que as options existirem, e so dai a primeira
    // busca dispara (senao ela sairia sem o filtro de armazem que veio de estoque.html)
    iniciarFiltroArmazemCondicional("filtroArmazem", "blocoFiltroArmazem").then(() => {
      const armazemInicial = parametrosIniciais.get("armazem");
      if (armazemInicial) document.getElementById("filtroArmazem").value = armazemInicial;
      buscarTudo();
    });

    // sugestao de nome enquanto digita, com debounce pra nao martelar a api a cada tecla
    const campoNomeProduto = document.getElementById("filtroNomeProduto");
    const caixaSugestoes = document.getElementById("sugestoesNomeProduto");
    let temporizadorSugestao = null;

    function esconderSugestoes() {
      caixaSugestoes.innerHTML = "";
      caixaSugestoes.classList.remove("aberto");
    }

    async function buscarSugestoes(termo) {
      try {
        const resp = await fetch(`/api/produtos_sugestoes?termo=${encodeURIComponent(termo)}`);
        const dados = await resp.json();

        if (!Array.isArray(dados) || dados.length === 0) {
          esconderSugestoes();
          return;
        }

        caixaSugestoes.innerHTML = dados
          .map((item) => `<div class="item-sugestao" data-nome="${escaparHtml(item.nome_produto)}">${escaparHtml(item.nome_produto)}</div>`)
          .join("");
        caixaSugestoes.classList.add("aberto");

        caixaSugestoes.querySelectorAll(".item-sugestao").forEach((item) => {
          item.addEventListener("click", () => {
            campoNomeProduto.value = item.dataset.nome;
            esconderSugestoes();
            buscarTudo();
          });
        });
      } catch (erro) {
        esconderSugestoes();
      }
    }

    campoNomeProduto.addEventListener("input", () => {
      const termo = campoNomeProduto.value.trim();
      clearTimeout(temporizadorSugestao);

      if (!termo) {
        esconderSugestoes();
        return;
      }

      temporizadorSugestao = setTimeout(() => buscarSugestoes(termo), 250);
    });

    // sugestao de descricao enquanto digita, com debounce pra nao martelar a api a cada tecla
    const campoDescricao = document.getElementById("filtroDescricao");
    const caixaSugestoesDescricao = document.getElementById("sugestoesDescricao");
    let temporizadorSugestaoDescricao = null;

    function esconderSugestoesDescricao() {
      caixaSugestoesDescricao.innerHTML = "";
      caixaSugestoesDescricao.classList.remove("aberto");
    }

    async function buscarSugestoesDescricao(termo) {
      try {
        const resp = await fetch(`/api/descricoes_sugestoes?termo=${encodeURIComponent(termo)}`);
        const dados = await resp.json();

        if (!Array.isArray(dados) || dados.length === 0) {
          esconderSugestoesDescricao();
          return;
        }

        caixaSugestoesDescricao.innerHTML = dados
          .map(
            (item) =>
              `<div class="item-sugestao" data-descricao="${escaparHtml(item.descricao_produto)}">${escaparHtml(item.descricao_produto)}</div>`
          )
          .join("");
        caixaSugestoesDescricao.classList.add("aberto");

        caixaSugestoesDescricao.querySelectorAll(".item-sugestao").forEach((item) => {
          item.addEventListener("click", () => {
            campoDescricao.value = item.dataset.descricao;
            esconderSugestoesDescricao();
            buscarTudo();
          });
        });
      } catch (erro) {
        esconderSugestoesDescricao();
      }
    }

    campoDescricao.addEventListener("input", () => {
      const termo = campoDescricao.value.trim();
      clearTimeout(temporizadorSugestaoDescricao);

      if (!termo) {
        esconderSugestoesDescricao();
        return;
      }

      temporizadorSugestaoDescricao = setTimeout(() => buscarSugestoesDescricao(termo), 250);
    });

    document.addEventListener("click", (ev) => {
      if (!ev.target.closest(".campo-autocompletar")) {
        esconderSugestoes();
        esconderSugestoesDescricao();
      }
    });

    // relatorios (pdf) e planilhas (csv) saem direto, sem pagina html intermediaria pra imprimir -
    // um relatorio muito grande impresso numa impressora fisica real estava travando ela

    // "Itens Movimentados": essa consulta traz todo mundo que bate o filtro de uma vez so, sem
    // paginacao, e um periodo grande ja travou o servico antes, entao o periodo fica limitado a
    // 30 dias - validacao compartilhada pelos botoes de pdf e csv dessa sessao
    const LIMITE_DIAS_RELATORIO = 30;

    function periodoDentroDoLimiteRelatorioDetalhado() {
      const dataInicio = document.getElementById("filtroDataInicio").value;
      const dataFim = document.getElementById("filtroDataFim").value;

      if (!dataInicio || !dataFim) {
        alert("Informe Data Início e Data Fim antes de gerar o relatório.");
        return false;
      }

      const dias = (new Date(dataFim) - new Date(dataInicio)) / (1000 * 60 * 60 * 24);
      if (dias > LIMITE_DIAS_RELATORIO) {
        alert(`O relatório de itens movimentados só pode ser gerado para períodos de até ${LIMITE_DIAS_RELATORIO} dias. Ajuste o filtro de data e tente novamente.`);
        return false;
      }

      return true;
    }

    // botao do Resumo: so a parte agregada (resumo geral + resumo por produto), sem tocar na
    // consulta detalhada pesada - por isso nao tem limite de periodo
    document.getElementById("botaoGerarRelatorioResumo").addEventListener("click", () => {
      const params = montarQueryFiltros();
      params.set("secao", "resumo");
      window.open(`/api/consumo_pdf?${params.toString()}`, "_blank");
    });

    document.getElementById("botaoCsvResumo").addEventListener("click", () => {
      const params = montarQueryFiltros();
      params.set("secao", "resumo");
      window.open(`/api/consumo_csv?${params.toString()}`, "_blank");
    });

    document.getElementById("botaoXlsxResumo").addEventListener("click", () => {
      const params = montarQueryFiltros();
      params.set("secao", "resumo");
      window.open(`/api/consumo_xlsx?${params.toString()}`, "_blank");
    });

    // botoes de Itens do CD / Itens do Hospital: cada lista tem seu proprio trio de botoes
    // (Gerar Relatório / CSV / Planilha), exportando so os itens daquela origem
    function ligarBotoesExportacaoDetalhado(origem, idPdf, idCsv, idXlsx) {
      document.getElementById(idPdf).addEventListener("click", () => {
        if (!periodoDentroDoLimiteRelatorioDetalhado()) return;
        const params = montarQueryFiltros();
        params.set("secao", "detalhado");
        params.set("origem", origem);
        window.open(`/api/consumo_pdf?${params.toString()}`, "_blank");
      });

      document.getElementById(idCsv).addEventListener("click", () => {
        if (!periodoDentroDoLimiteRelatorioDetalhado()) return;
        const params = montarQueryFiltros();
        params.set("secao", "detalhado");
        params.set("origem", origem);
        window.open(`/api/consumo_csv?${params.toString()}`, "_blank");
      });

      document.getElementById(idXlsx).addEventListener("click", () => {
        if (!periodoDentroDoLimiteRelatorioDetalhado()) return;
        const params = montarQueryFiltros();
        params.set("secao", "detalhado");
        params.set("origem", origem);
        window.open(`/api/consumo_xlsx?${params.toString()}`, "_blank");
      });
    }

    ligarBotoesExportacaoDetalhado("cd", "botaoGerarRelatorioCd", "botaoCsvCd", "botaoXlsxCd");
    ligarBotoesExportacaoDetalhado("hospital", "botaoGerarRelatorioHospital", "botaoCsvHospital", "botaoXlsxHospital");
  </script>
