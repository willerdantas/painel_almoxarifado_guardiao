<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INSYSTEM | Movimentações do Produto</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    @media print {
      .no-imprimir {
        display: none !important;
      }
      body {
        background: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="conteudo">
      <div class="topo-pagina">
        <h1>Movimentações do Produto</h1>
        <div class="topo-direita">
          <div class="grupo-botoes-filtro no-imprimir">
            <button type="button" class="botao-resetar" id="botaoVoltar">Voltar</button>
            <button type="button" class="botao-filtrar" id="botaoImprimir">Imprimir</button>
          </div>
          <div class="area-usuario no-imprimir">
            <span class="usuario-logado" id="usuarioLogado"></span>
            <button class="botao-sair" id="botaoSairTopo">Sair</button>
          </div>
          <img src="/static/logo_insystem.png" alt="INSYSTEM" class="logo-topo" />
        </div>
      </div>

      <section class="cartao" id="cartaoResumo">
        <p class="msg-vazio">Carregando dado, aguenta ai...</p>
      </section>

      <section class="cartao secao-pedidos">
        <div class="secao-cabecalho">
          <h2>Entradas e Saídas</h2>
          <span class="contador-secao" id="contadorMovimentacoes">0</span>
        </div>
        <p class="msg-vazio" id="avisoLimite" style="display: none;">
          Mostrando os 3000 registros mais recentes do período. Refine as datas pra ver um recorte mais preciso.
        </p>
        <div id="areaMovimentacoes">
          <p class="msg-vazio">Carregando dado, aguenta ai...</p>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/js/sidebar.js"></script>
  <script>
    // caverna so abre pra quem tem crachá - relatorio nao tem menu lateral, so o essencial do topo
    protegerPagina();
    document.getElementById("usuarioLogado").textContent = localStorage.getItem("usuario") || "visitante";
    document.getElementById("botaoSairTopo").addEventListener("click", sair);

    // imprime a pagina - homem escolhe "salvar como PDF" na propria caixa de impressao do navegador
    document.getElementById("botaoImprimir").addEventListener("click", () => window.print());

    // essa pagina so existe aberta numa aba nova (window.open) vinda do controle de estoque, entao
    // voltar aqui eh so fechar essa aba mesmo
    document.getElementById("botaoVoltar").addEventListener("click", () => window.close());

    const parametros = new URLSearchParams(window.location.search);
    const produto = parametros.get("produto");
    const nomeProduto = parametros.get("nome_produto") || "";
    const codSeplag = parametros.get("cod_seplag") || "";
    const codAlmox = parametros.get("cod_almox") || "";
    const dataInicio = parametros.get("data_inicio") || "";
    const dataFim = parametros.get("data_fim") || "";

    function formatarDataBr(iso) {
      if (!iso) return "";
      const [ano, mes, dia] = iso.split("-");
      return `${dia}-${mes}-${ano.slice(2)}`;
    }

    function montarResumo(estoqueAtual, movimentacoes) {
      const periodo =
        dataInicio || dataFim
          ? `${dataInicio ? formatarDataBr(dataInicio) : "início"} até ${dataFim ? formatarDataBr(dataFim) : "hoje"}`
          : "todo o histórico";

      const quantidadeAtual = estoqueAtual ? Number(estoqueAtual.quantidade) : null;
      const custoMedio = estoqueAtual ? Number(estoqueAtual.customedio) : null;
      const valorTotal = quantidadeAtual !== null && custoMedio !== null ? quantidadeAtual * custoMedio : null;

      const armazens = [...new Set((movimentacoes || []).map((item) => item.armazem).filter(Boolean))];

      document.getElementById("cartaoResumo").innerHTML = `
        <h2 style="margin-bottom: 10px;">${escaparHtml(nomeProduto || "Produto " + produto)}</h2>
        <p style="font-size: 13px; color: #556; margin-bottom: 14px;">
          Cód. Produto: ${escaparHtml(produto)} · Cód. Seplag: ${escaparHtml(codSeplag !== "" ? codSeplag : "—")} · Cód. Almox: ${escaparHtml(codAlmox !== "" ? codAlmox : "—")} · Período: ${escaparHtml(periodo)}
        </p>
        <div class="barra-saldo-linha">
          <span class="saldo-info"><strong>Estoque Atual (independente do período acima):</strong> ${
            quantidadeAtual !== null ? quantidadeAtual.toLocaleString("pt-BR") : "—"
          } un.</span>
          <span class="saldo-info"><strong>Custo Médio:</strong> ${custoMedio !== null ? formatarMoeda(custoMedio) : "—"}</span>
          <span class="saldo-info"><strong>Valor Total em Estoque:</strong> ${valorTotal !== null ? formatarMoeda(valorTotal) : "—"}</span>
        </div>
        <p style="font-size: 13px; color: #556; margin-top: 10px;">
          <strong>Armazém(ns) nas movimentações do período:</strong> ${escaparHtml(armazens.length ? armazens.join(", ") : "—")}
        </p>
      `;
    }

    function montarTabela(movimentacoes) {
      const container = document.getElementById("areaMovimentacoes");

      if (!Array.isArray(movimentacoes) || movimentacoes.length === 0) {
        container.innerHTML = '<p class="msg-vazio">Nenhuma movimentação encontrada nesse período.</p>';
        return;
      }

      document.getElementById("avisoLimite").style.display = movimentacoes.length >= 3000 ? "block" : "none";

      const linhas = movimentacoes
        .map((item) => {
          const quantidade = Number(item.quantidade) || 0;
          const cor = quantidade < 0 ? "var(--vermelho)" : "#2e9e44";
          return `
        <tr>
          <td>${escaparHtml(item.data)}</td>
          <td class="celula-quebra">${escaparHtml(item.nome_pessoa)}</td>
          <td>${escaparHtml(item.tipo_movimentacao)}</td>
          <td>${escaparHtml(item.lote)}</td>
          <td style="color: ${cor}; font-weight: 600;">${quantidade.toLocaleString("pt-BR")}</td>
          <td>${formatarMoeda(item.valor_unitario)}</td>
          <td style="color: ${cor}; font-weight: 600;">${formatarMoeda(item.subtotal)}</td>
        </tr>`;
        })
        .join("");

      container.innerHTML = `
        <table class="tabela-dados">
          <thead>
            <tr>
              <th>Data</th>
              <th>Pessoa</th>
              <th>Tipo de Movimentação</th>
              <th>Lote</th>
              <th>Quantidade</th>
              <th>Vl. Unitário</th>
              <th>Subtotal</th>
            </tr>
          </thead>
          <tbody>${linhas}</tbody>
        </table>`;
    }

    async function carregarMovimentacoes() {
      if (!produto) {
        document.getElementById("cartaoResumo").innerHTML = '<p class="msg-vazio">Produto não informado.</p>';
        document.getElementById("areaMovimentacoes").innerHTML = "";
        return;
      }

      try {
        const params = new URLSearchParams({ produto });
        if (dataInicio) params.set("data_inicio", dataInicio);
        if (dataFim) params.set("data_fim", dataFim);

        const resp = await fetch(`/api/estoque_movimentacoes?${params.toString()}`);
        const resultado = await resp.json();

        if (resultado.erro) {
          document.getElementById("areaMovimentacoes").innerHTML = `<p class="msg-vazio">Erro: ${escaparHtml(resultado.erro)}</p>`;
          return;
        }

        montarResumo(resultado.estoque_atual, resultado.movimentacoes);
        document.getElementById("contadorMovimentacoes").textContent = (resultado.movimentacoes || []).length;
        montarTabela(resultado.movimentacoes);
      } catch (erro) {
        document.getElementById("areaMovimentacoes").innerHTML = `<p class="msg-vazio">Erro ao caçar dados: ${escaparHtml(erro)}</p>`;
      }
    }

    carregarMovimentacoes();
  </script>
</body>
</html>
