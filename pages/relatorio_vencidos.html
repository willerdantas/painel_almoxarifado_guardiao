<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INSYSTEM | Relatório de Produtos Vencidos por Armazém</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    @media print {
      .no-imprimir {
        display: none !important;
      }
      body {
        background: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="conteudo">
      <div class="topo-pagina">
        <h1>Relatório de Produtos Vencidos por Armazém</h1>
        <div class="topo-direita">
          <div class="grupo-botoes-filtro no-imprimir">
            <button type="button" class="botao-resetar" id="botaoVoltar">Voltar</button>
            <button type="button" class="botao-filtrar" id="botaoImprimir">Imprimir</button>
          </div>
          <div class="area-usuario no-imprimir">
            <span class="usuario-logado" id="usuarioLogado"></span>
            <button class="botao-sair" id="botaoSairTopo">Sair</button>
          </div>
          <img src="/static/logo_insystem.png" alt="INSYSTEM" class="logo-topo" />
        </div>
      </div>

      <section class="cartao" id="cartaoResumo">
        <p class="msg-vazio">Carregando dado, aguenta ai...</p>
      </section>

      <section class="cartao secao-pedidos">
        <div class="secao-cabecalho">
          <h2>Por Armazém</h2>
          <span class="contador-secao" id="contadorArmazens">0</span>
        </div>
        <div id="areaRelatorio">
          <p class="msg-vazio">Carregando dado, aguenta ai...</p>
        </div>
      </section>

      <section class="cartao secao-pedidos">
        <div class="secao-cabecalho">
          <h2>Itens Detalhados</h2>
          <span class="contador-secao" id="contadorItens">0</span>
        </div>
        <div id="areaDetalhado">
          <p class="msg-vazio">Carregando dado, aguenta ai...</p>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/js/sidebar.js"></script>
  <script>
    // caverna so abre pra quem tem crachá - relatorio nao tem menu lateral, so o essencial do topo
    protegerPagina();
    document.getElementById("usuarioLogado").textContent = localStorage.getItem("usuario") || "visitante";
    document.getElementById("botaoSairTopo").addEventListener("click", sair);

    // imprime a pagina - homem escolhe "salvar como PDF" na propria caixa de impressao do navegador
    document.getElementById("botaoImprimir").addEventListener("click", () => window.print());

    // essa pagina so existe aberta numa aba nova (window.open) vinda de vencidos.html, entao
    // voltar aqui eh so fechar essa aba mesmo
    document.getElementById("botaoVoltar").addEventListener("click", () => window.close());

    const parametros = new URLSearchParams(window.location.search);

    function montarResumo() {
      const filtros = [];
      if (parametros.get("cod_seplag")) filtros.push(`Cód. Seplag: ${parametros.get("cod_seplag")}`);
      if (parametros.get("cod_almox")) filtros.push(`Cód. Almox: ${parametros.get("cod_almox")}`);
      if (parametros.get("cod_produto")) filtros.push(`Cód. Produto: ${parametros.get("cod_produto")}`);
      if (parametros.get("nome_produto")) filtros.push(`Nome do Produto: ${parametros.get("nome_produto")}`);
      if (parametros.get("lote")) filtros.push(`Lote: ${parametros.get("lote")}`);
      if (parametros.get("armazem")) filtros.push(`Armazém: ${parametros.get("armazem")}`);

      const agora = new Date();
      const dataGeracao = agora.toLocaleDateString("pt-BR") + " " + agora.toLocaleTimeString("pt-BR");

      document.getElementById("cartaoResumo").innerHTML = `
        <p style="font-size: 13px; color: #556;">
          <strong>Gerado em:</strong> ${dataGeracao}<br />
          <strong>Filtros aplicados:</strong> ${filtros.length ? filtros.join(" · ") : "Nenhum (todos os produtos vencidos)"}
        </p>
      `;
    }

    function montarTabela(armazens) {
      const container = document.getElementById("areaRelatorio");
      document.getElementById("contadorArmazens").textContent = armazens.length;

      if (!Array.isArray(armazens) || armazens.length === 0) {
        container.innerHTML = '<p class="msg-vazio">Nenhum armazém com produto vencido pros filtros informados.</p>';
        return;
      }

      const totalQuantidade = armazens.reduce((soma, item) => soma + (Number(item.quantidade_vencida) || 0), 0);
      const totalValor = armazens.reduce((soma, item) => soma + (Number(item.valor_vencido) || 0), 0);

      const linhas = armazens
        .map(
          (item) => `
        <tr>
          <td>${item.nome_armazem ?? ""}</td>
          <td>${formatarQuantidade(item.quantidade_vencida)}</td>
          <td>${formatarMoeda(item.valor_vencido)}</td>
        </tr>`
        )
        .join("");

      container.innerHTML = `
        <table class="tabela-dados">
          <thead>
            <tr>
              <th>Armazém</th>
              <th>Qtde. Vencida</th>
              <th>Valor Vencido</th>
            </tr>
          </thead>
          <tbody>${linhas}</tbody>
          <tfoot>
            <tr style="font-weight: 700;">
              <td>Total Geral</td>
              <td>${formatarQuantidade(totalQuantidade)}</td>
              <td>${formatarMoeda(totalValor)}</td>
            </tr>
          </tfoot>
        </table>`;
    }

    function montarTabelaDetalhado(itens) {
      const container = document.getElementById("areaDetalhado");
      document.getElementById("contadorItens").textContent = itens.length;

      if (!Array.isArray(itens) || itens.length === 0) {
        container.innerHTML = '<p class="msg-vazio">Nenhum item vencido pros filtros informados.</p>';
        return;
      }

      const totalQuantidade = itens.reduce((soma, item) => soma + (Number(item.quantidade) || 0), 0);
      const totalValor = itens.reduce((soma, item) => soma + (Number(item.valor_total) || 0), 0);

      const linhas = itens
        .map(
          (item) => `
        <tr>
          <td>${item.cod_seplag ?? ""}</td>
          <td>${item.cod_almox ?? ""}</td>
          <td>${item.cod_produto ?? ""}</td>
          <td class="celula-quebra">${item.nome_produto ?? ""}</td>
          <td>${item.lote ?? ""}</td>
          <td>${item.validade ?? ""}</td>
          <td>${item.nome_armazem ?? ""}</td>
          <td>${formatarQuantidade(item.quantidade)}</td>
          <td>${formatarMoeda(item.valor_unitario)}</td>
          <td>${formatarMoeda(item.valor_total)}</td>
        </tr>`
        )
        .join("");

      container.innerHTML = `
        <table class="tabela-dados">
          <thead>
            <tr>
              <th>Cód. Seplag</th>
              <th>Cód. Almox</th>
              <th>Cód. Produto</th>
              <th>Nome do Produto</th>
              <th>Lote</th>
              <th>Validade</th>
              <th>Armazém</th>
              <th>Quantidade</th>
              <th>Valor Unitário</th>
              <th>Valor Total</th>
            </tr>
          </thead>
          <tbody>${linhas}</tbody>
          <tfoot>
            <tr style="font-weight: 700;">
              <td colspan="7">Total Geral</td>
              <td>${formatarQuantidade(totalQuantidade)}</td>
              <td></td>
              <td>${formatarMoeda(totalValor)}</td>
            </tr>
          </tfoot>
        </table>`;
    }

    async function carregarRelatorio() {
      montarResumo();
      try {
        const resp = await fetch(`/api/vencidos_por_armazem?${parametros.toString()}`);
        const armazens = await resp.json();
        montarTabela(armazens);
      } catch (erro) {
        document.getElementById("areaRelatorio").innerHTML = `<p class="msg-vazio">Erro ao carregar relatório: ${erro}</p>`;
      }

      try {
        const resp = await fetch(`/api/vencidos_detalhado?${parametros.toString()}`);
        const itens = await resp.json();
        montarTabelaDetalhado(itens);
      } catch (erro) {
        document.getElementById("areaDetalhado").innerHTML = `<p class="msg-vazio">Erro ao carregar itens: ${erro}</p>`;
      }
    }

    carregarRelatorio();
  </script>
</body>
</html>
